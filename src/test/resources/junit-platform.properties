# Orden aleatorio de clases y métodos: la base de datos de pruebas es compartida y esto detecta dependencias entre pruebas.
# JUnit escribe la semilla en el log; para repetir una corrida use junit.jupiter.execution.order.random.seed.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
