# Perfil local (desarrollo en esta máquina): documentación de la API, datos de demostración, correo a Mailpit y CORS
# para el frontend en localhost:3000. Nunca usar en producción.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

fundigsac:
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    allow-ephemeral-keys: true
  identity:
    jwt:
      issuer: http://localhost:8080
  notifications:
    delivery: ${MAIL_DELIVERY:smtp}
    site-url: ${SITE_URL:http://localhost:3000}
    admin-url: ${ADMIN_URL:http://localhost:3110}
